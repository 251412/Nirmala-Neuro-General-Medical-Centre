<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Circle / Card -->
  <rect width="240" height="240" fill="url(#bgGrad)" />

  <!-- Soft Ambient Glow Behind Head -->
  <circle cx="120" cy="95" r="48" fill="#bae6fd" opacity="0.4" />

  <!-- Head -->
  <circle cx="120" cy="92" r="38" fill="url(#avatarGrad)" filter="url(#subtleShadow)" />

  <!-- Lab Coat & Shoulders -->
  <path d="M48 240 C48 180, 80 156, 120 156 C160 156, 192 180, 192 240 Z" fill="url(#avatarGrad)" />
  
  <!-- Doctor White Coat Lapels -->
  <path d="M76 240 L104 175 L120 198 L136 175 L164 240 Z" fill="url(#coatGrad)" />
  <!-- Coat Collar & V-Neck -->
  <path d="M104 175 L120 206 L136 175 Z" fill="#0284c7" opacity="0.25" />
  <path d="M120 198 L120 240" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

  <!-- Stethoscope around neck -->
  <path d="M96 178 C96 212, 144 212, 144 178" fill="none" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round" />
  <path d="M136 210 L136 222" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
  <circle cx="136" cy="225" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
</svg>
